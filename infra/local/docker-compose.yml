name: betterbooking-local

services:
  local-secret-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - betterbooking-local-secrets:/run/betterbooking-local-secrets
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/betterbooking-local-secrets
        if [ ! -s /run/betterbooking-local-secrets/postgres-password ]; then
          dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 > /run/betterbooking-local-secrets/postgres-password
        fi
        if [ ! -s /run/betterbooking-local-secrets/auth-cookie-secret ]; then
          dd if=/dev/urandom bs=48 count=1 2>/dev/null | base64 > /run/betterbooking-local-secrets/auth-cookie-secret
        fi
        chmod 0444 /run/betterbooking-local-secrets/postgres-password /run/betterbooking-local-secrets/auth-cookie-secret

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      local-secret-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: betterbooking
      POSTGRES_USER: betterbooking
      POSTGRES_PASSWORD_FILE: /run/betterbooking-local-secrets/postgres-password
    ports:
      - "127.0.0.1:${BETTERBOOKING_POSTGRES_PORT:-54329}:5432"
    volumes:
      - betterbooking-local-secrets:/run/betterbooking-local-secrets:ro
      - betterbooking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host localhost --dbname betterbooking --username betterbooking"]
      interval: 5s
      timeout: 5s
      retries: 12

  local-oidc:
    build:
      context: ../..
      dockerfile: infra/local/oidc/Dockerfile
    restart: unless-stopped
    environment:
      LOCAL_OIDC_ISSUER: ${BETTERBOOKING_LOCAL_OIDC_ISSUER:-http://localhost:5080}
      LOCAL_OIDC_INTERNAL_BASE_URL: http://local-oidc:8080
      LOCAL_OIDC_AUDIENCE: ${BETTERBOOKING_AUTH_AUDIENCE:-betterbooking-api}
      LOCAL_OIDC_CLIENT_ID: ${BETTERBOOKING_AUTH_CLIENT_ID:-betterbooking-local-web}
    ports:
      - "127.0.0.1:${BETTERBOOKING_LOCAL_OIDC_PORT:-5080}:8080"

  database-migrations:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: migrations
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - betterbooking-local-secrets:/run/betterbooking-local-secrets:ro
    command:
      - /bin/sh
      - -ec
      - |
        export BETTERBOOKING_DESIGNTIME_CONNECTION_STRING="Host=postgres;Port=5432;Database=betterbooking;Username=betterbooking;Password=$$(cat /run/betterbooking-local-secrets/postgres-password);Include Error Detail=false"
        dotnet tool run dotnet-ef database update --project apps/backend/src/App.Infrastructure/App.Infrastructure.csproj --startup-project apps/backend/src/App.Infrastructure/App.Infrastructure.csproj --context ApplicationDbContext

  database-seed:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    volumes:
      - betterbooking-local-secrets:/run/betterbooking-local-secrets:ro
    environment:
      LOCAL_OIDC_ISSUER: ${BETTERBOOKING_LOCAL_OIDC_ISSUER:-http://localhost:5080}
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$(cat /run/betterbooking-local-secrets/postgres-password)"
        psql --host postgres --username betterbooking --dbname betterbooking --set ON_ERROR_STOP=1 --set external_provider="$${LOCAL_OIDC_ISSUER}" <<'SQL'
        INSERT INTO users (id, external_provider, external_subject, email, display_name, created_at, updated_at)
        VALUES
          ('11111111-1111-1111-1111-111111111111', :'external_provider', 'local-admin-1', 'host@example.test', 'Mateusz Host Admin', now(), now())
        ON CONFLICT (id) DO UPDATE SET
          external_provider = EXCLUDED.external_provider,
          external_subject = EXCLUDED.external_subject,
          email = EXCLUDED.email,
          display_name = EXCLUDED.display_name,
          updated_at = now();

        INSERT INTO listings (
          id,
          owner_user_id,
          title,
          description,
          location,
          nightly_price_amount,
          max_guests,
          bedroom_count,
          bathroom_count,
          hero_image_url,
          amenities,
          status,
          created_at
        )
        VALUES
          (
            '22222222-2222-2222-2222-222222222222',
            '11111111-1111-1111-1111-111111111111',
            'Old Town serviced apartment',
            'A quiet apartment near the main square with a real desk, fast Wi-Fi, self check-in, and enough room for a couple or remote worker.',
            'Krakow, Old Town',
            185.00,
            3,
            1,
            1,
            '',
            'Wi-Fi, kitchen, workspace, self check-in',
            'Published',
            now() - interval '3 days'
          ),
          (
            '33333333-3333-3333-3333-333333333333',
            '11111111-1111-1111-1111-111111111111',
            'Riverside family hotel suite',
            'Two connected rooms in a calm riverside hotel with breakfast nearby, luggage storage, elevator access, and flexible arrival support.',
            'Warsaw, Powisle',
            260.00,
            5,
            2,
            1,
            '',
            'Breakfast nearby, elevator, luggage storage, river walk',
            'Published',
            now() - interval '1 day'
          )
        ON CONFLICT (id) DO NOTHING;
        SQL

  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      database-seed:
        condition: service_completed_successfully
      local-oidc:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Authority: ${BETTERBOOKING_AUTH_ISSUER:-http://local-oidc:8080}
      Authentication__Audience: ${BETTERBOOKING_AUTH_AUDIENCE:-betterbooking-api}
      Cors__AllowedOrigins__0: ${BETTERBOOKING_WEB_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${BETTERBOOKING_API_PORT:-5245}:8080"
    volumes:
      - betterbooking-local-secrets:/run/betterbooking-local-secrets:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export ConnectionStrings__ApplicationDatabase="Host=postgres;Port=5432;Database=betterbooking;Username=betterbooking;Password=$$(cat /run/betterbooking-local-secrets/postgres-password);Include Error Detail=false"
        exec dotnet App.Api.dll

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      local-oidc:
        condition: service_started
    environment:
      BETTERBOOKING_API_BASE_URL: http://api:8080
      BETTERBOOKING_WEB_BASE_URL: ${BETTERBOOKING_WEB_BASE_URL:-http://localhost:3000}
      BETTERBOOKING_AUTH_ISSUER: ${BETTERBOOKING_AUTH_ISSUER:-http://local-oidc:8080}
      BETTERBOOKING_AUTH_AUDIENCE: ${BETTERBOOKING_AUTH_AUDIENCE:-betterbooking-api}
      BETTERBOOKING_AUTH_CLIENT_ID: ${BETTERBOOKING_AUTH_CLIENT_ID:-betterbooking-local-web}
      BETTERBOOKING_AUTH_CLIENT_SECRET: ${BETTERBOOKING_AUTH_CLIENT_SECRET:-}
      BETTERBOOKING_AUTH_SCOPES: ${BETTERBOOKING_AUTH_SCOPES:-openid profile email}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${BETTERBOOKING_WEB_PORT:-3000}:3000"
    volumes:
      - betterbooking-local-secrets:/run/betterbooking-local-secrets:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export BETTERBOOKING_AUTH_COOKIE_SECRET="$$(cat /run/betterbooking-local-secrets/auth-cookie-secret)"
        exec node server.js

volumes:
  betterbooking-local-secrets:
  betterbooking-postgres-data:
